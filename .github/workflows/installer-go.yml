name: Installer Go

on:
  pull_request:
    paths:
      - "Linux/installer/**"
      - "Linux/NixOS/flake.nix"
      - ".github/dependabot.yml"
      - ".github/workflows/installer-go.yml"
  push:
    branches:
      - main
    paths:
      - "Linux/installer/**"
      - "Linux/NixOS/flake.nix"
      - ".github/dependabot.yml"
      - ".github/workflows/installer-go.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: Linux/installer/go.mod
          cache-dependency-path: Linux/installer/go.sum

      - name: Install Nix
        uses: cachix/install-nix-action@v31.10.5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check installer
        run: make -C Linux/installer check
