name: Installer Go

on:
  pull_request:
    paths:
      - "Linux/installer/**"
      - "Linux/dots/**"
      - "Linux/NixOS/flake.nix"
      - "Linux/NixOS/flake.lock"
      - "Linux/NixOS/home/**"
      - "Linux/NixOS/hosts/**"
      - "Linux/NixOS/modules/**"
      - "Linux/NixOS/packages/**"
      - "Linux/NixOS/programs/**"
      - "Linux/NixOS/services/**"
      - "Linux/NixOS/system/**"
      - ".github/dependabot.yml"
      - ".github/workflows/installer-go.yml"
  push:
    branches:
      - main
    paths:
      - "Linux/installer/**"
      - "Linux/dots/**"
      - "Linux/NixOS/flake.nix"
      - "Linux/NixOS/flake.lock"
      - "Linux/NixOS/home/**"
      - "Linux/NixOS/hosts/**"
      - "Linux/NixOS/modules/**"
      - "Linux/NixOS/packages/**"
      - "Linux/NixOS/programs/**"
      - "Linux/NixOS/services/**"
      - "Linux/NixOS/system/**"
      - ".github/dependabot.yml"
      - ".github/workflows/installer-go.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: Linux/installer/go.mod
          cache-dependency-path: Linux/installer/go.sum

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check installer
        run: make -C Linux/installer check
