name: Sync dev with main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-dev-with-main
  cancel-in-progress: false

jobs:
  sync-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward dev to main
        env:
          GH_TOKEN: ${{ secrets.WAHRWELT_AUTOMATION_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::WAHRWELT_AUTOMATION_TOKEN is not configured"
            exit 1
          fi

          git fetch origin dev main

          main_sha="$(git rev-parse origin/main)"
          dev_sha="$(git rev-parse origin/dev)"

          if [ "$dev_sha" = "$main_sha" ]; then
            echo "dev is already synchronized with main"
            exit 0
          fi

          if git merge-base --is-ancestor "$main_sha" "$dev_sha"; then
            echo "::warning::dev already contains main and has additional commits; preserving dev"
            exit 0
          fi

          if ! git merge-base --is-ancestor "$dev_sha" "$main_sha"; then
            echo "::warning::dev and main have diverged; preserving dev-only commits"
            exit 0
          fi

          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/dev" \
            -f "sha=$main_sha" \
            -F "force=false" >/dev/null

          git fetch origin dev main
          synced_dev_sha="$(git rev-parse origin/dev)"
          synced_main_sha="$(git rev-parse origin/main)"
          if [ "$synced_dev_sha" != "$synced_main_sha" ]; then
            echo "::error::dev and main differ after synchronization"
            exit 1
          fi
