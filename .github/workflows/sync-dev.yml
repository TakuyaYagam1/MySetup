name: Sync dev with main

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Update flake inputs
      - Update OmniRouter
      - Update Portainer
      - Update Caelestia
      - Update Noctalia
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-dev-with-main
  cancel-in-progress: false

jobs:
  sync-dev:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward dev to main
        run: |
          git fetch origin dev main

          main_sha="$(git rev-parse origin/main)"
          dev_sha="$(git rev-parse origin/dev)"

          if [ "$dev_sha" = "$main_sha" ]; then
            echo "dev is already synchronized with main"
            exit 0
          fi

          if ! git merge-base --is-ancestor "$dev_sha" "$main_sha"; then
            echo "::error::dev has commits that are not in main; refusing to overwrite divergent history"
            exit 1
          fi

          git push origin "$main_sha:refs/heads/dev"

          git fetch origin dev main
          synced_dev_sha="$(git rev-parse origin/dev)"
          synced_main_sha="$(git rev-parse origin/main)"
          if [ "$synced_dev_sha" != "$synced_main_sha" ]; then
            echo "::error::dev and main differ after synchronization"
            exit 1
          fi
