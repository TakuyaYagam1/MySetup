name: Update flake inputs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: read

concurrency:
  group: update-flake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-flake:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync latest branch tip
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
            experimental-features = nix-command flakes

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-
          purge-created: 0
          purge-last-accessed: 0
          purge-primary-key: never

      - name: Update flake inputs
        run: nix flake update

      - name: Update NixOS flake inputs
        working-directory: Linux/NixOS
        run: nix flake update

      - name: Update preset flake inputs
        run: |
          for preset in minimal desktop developer personal; do
            nix flake update "path:${GITHUB_WORKSPACE}?dir=Linux/NixOS/presets/${preset}"
          done

      - name: Check public flake
        run: nix flake check --no-build

      - name: Build public shell module check
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.shells-module

      - name: Check preset flakes
        run: |
          for preset in minimal desktop developer personal; do
            nix flake check --no-build --no-write-lock-file \
              "path:${GITHUB_WORKSPACE}?dir=Linux/NixOS/presets/${preset}"
          done

      - name: Build public Wahrwelt package
        run: nix build .#wahrwelt --print-build-logs

      - name: Smoke-test public Wahrwelt and legacy binaries
        run: |
          ./result/bin/wahrwelt --help
          ./result/bin/mysetup --help
          nix build --no-link .#mysetup --print-build-logs

      - name: Build patched end4 Hypr config
        working-directory: Linux/NixOS
        run: nix build --no-link --print-build-logs '.#nixosConfigurations.NixOS.config.home-manager.users.user.xdg.configFile."hypr/end4".source'

      - name: Build patched Caelestia shell
        working-directory: Linux/NixOS
        run: nix build --no-link --print-build-logs '.#nixosConfigurations.NixOS.config.home-manager.users.user.programs.caelestia.package'

      - name: Build NixOS Wahrwelt package
        working-directory: Linux/NixOS
        run: nix build .#wahrwelt --print-build-logs

      - name: Smoke-test NixOS Wahrwelt and legacy binaries
        working-directory: Linux/NixOS
        run: |
          ./result/bin/wahrwelt --help
          ./result/bin/mysetup --help
          nix build --no-link .#mysetup --print-build-logs

      - name: Check for changes
        id: check
        working-directory: ${{ github.workspace }}
        run: |
          if git diff --exit-code \
            flake.lock \
            Linux/NixOS/flake.lock \
            Linux/NixOS/presets/*/flake.lock > /dev/null; then
            echo "modified=false" >> "$GITHUB_OUTPUT"
          else
            echo "modified=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        id: cpr
        if: steps.check.outputs.modified == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.WAHRWELT_AUTOMATION_TOKEN }}
          commit-message: "chore(nix): update flake locks"
          branch: "update-flake-locks"
          delete-branch: true
          add-paths: |
            flake.lock
            Linux/NixOS/flake.lock
            Linux/NixOS/presets/minimal/flake.lock
            Linux/NixOS/presets/desktop/flake.lock
            Linux/NixOS/presets/developer/flake.lock
            Linux/NixOS/presets/personal/flake.lock
          title: "chore(nix): update flake locks"
          body: |
            ## What

            Updates root, full NixOS, and preset-specific flake locks after scheduled input refresh.

            ## Why

            Keeps pinned flake inputs current while preserving review through a pull request.

            ## Testing

            - `nix flake check --no-build`
            - `nix build --no-link --print-build-logs .#checks.x86_64-linux.shells-module`
            - preset `nix flake check --no-build --no-write-lock-file`
            - `nix build .#wahrwelt --print-build-logs`
            - `nix build --no-link .#mysetup --print-build-logs`
            - `./result/bin/wahrwelt --help`
            - `./result/bin/mysetup --help`
            - `nix build --no-link --print-build-logs '.#nixosConfigurations.NixOS.config.home-manager.users.user.xdg.configFile."hypr/end4".source'`
            - `nix build --no-link --print-build-logs '.#nixosConfigurations.NixOS.config.home-manager.users.user.programs.caelestia.package'`
            - `nix build .#wahrwelt --print-build-logs`
            - `nix build --no-link .#mysetup --print-build-logs`
            - `./result/bin/wahrwelt --help`
            - `./result/bin/mysetup --help`

      - name: Validate and merge pull request
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.WAHRWELT_AUTOMATION_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: bash .github/scripts/merge-automation-pr.sh "$PR_NUMBER"
