name: Update Burp MCP

on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * 1"

jobs:
  update-burp-mcp:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31.10.5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Read current version
        id: current
        run: |
          current="$(grep -oP 'burpMcpVersion = "\K[^"]+' Linux/NixOS/packages/burp-mcp.nix | head -1)"
          echo "version=$current" >> "$GITHUB_OUTPUT"

      - name: Resolve latest BApp release
        id: release
        run: |
          page="$(curl -fsSL https://portswigger.net/bappstore/9952290f04ed4f628e624d0aa9dccebc)"

          version="$(printf '%s' "$page" | grep -oP '(?<=<p id="Version">)[^<]+' | head -1)"
          url="$(printf '%s' "$page" | grep -oP '(?<=href=")https://portswigger\.net/bappstore/bapps/download/9952290f04ed4f628e624d0aa9dccebc/[0-9]+(?=" id="DownloadedLink")' | head -1)"

          if [ -z "$version" ] || [ "$version" = "null" ] || [ -z "$url" ]; then
            echo "::error::Failed to resolve latest Burp MCP BApp metadata"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        run: |
          current="${{ steps.current.outputs.version }}"
          target="${{ steps.release.outputs.version }}"

          if [ "$current" = "$target" ]; then
            echo "should_update=false" >> "$GITHUB_OUTPUT"
            echo "Burp MCP is already on v$current"
            exit 0
          fi

          newest="$(printf '%s\n%s\n' "$current" "$target" | sort -V | tail -1)"
          if [ "$newest" != "$target" ]; then
            echo "should_update=false" >> "$GITHUB_OUTPUT"
            echo "Latest BApp release v$target is not newer than packaged v$current; skipping downgrade."
            exit 0
          fi

          echo "should_update=true" >> "$GITHUB_OUTPUT"
          echo "Updating Burp MCP: v$current -> v$target"

      - name: Compute BApp hash
        id: src
        if: steps.compare.outputs.should_update == 'true'
        run: |
          hash="$(
            nix store prefetch-file --json "${{ steps.release.outputs.url }}" \
              | jq -r '.hash'
          )"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Patch version, URL, and hash
        if: steps.compare.outputs.should_update == 'true'
        run: |
          sed -i 's/burpMcpVersion = "[^"]*"/burpMcpVersion = "${{ steps.release.outputs.version }}"/' Linux/NixOS/packages/burp-mcp.nix
          sed -i 's|url = "https://portswigger.net/bappstore/bapps/download/9952290f04ed4f628e624d0aa9dccebc/[0-9][0-9]*"|url = "${{ steps.release.outputs.url }}"|' Linux/NixOS/packages/burp-mcp.nix
          sed -i 's|hash = "sha256-[^"]*"|hash = "${{ steps.src.outputs.hash }}"|' Linux/NixOS/packages/burp-mcp.nix

      - name: Verify helper builds
        if: steps.compare.outputs.should_update == 'true'
        run: |
          NIXPKGS_ALLOW_UNFREE=1 nix build --no-write-lock-file --impure --expr '
            let
              pkgs = import <nixpkgs> { config.allowUnfree = true; };
              module = import ./Linux/NixOS/packages/burp-mcp.nix {
                inherit pkgs;
                lib = pkgs.lib;
                config = { mysetup.features.ctfTools = true; };
              };
              packages = [
                (builtins.elemAt module.environment.systemPackages 0)
                (builtins.elemAt module.environment.systemPackages 1)
                (builtins.elemAt module.environment.systemPackages 2)
                (builtins.elemAt module.environment.systemPackages 3)
              ];
            in
            pkgs.linkFarm "burp-mcp-test" (map (p: { name = p.name; path = p; }) packages)
          '

      - name: Create pull request
        if: steps.compare.outputs.should_update == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(nix): update burp mcp"
          branch: "update-burp-mcp"
          delete-branch: true
          add-paths: |
            Linux/NixOS/packages/burp-mcp.nix
          title: "Update Burp MCP to v${{ steps.release.outputs.version }}"
          body: |
            Updates local `burp-mcp` packaging to `v${{ steps.release.outputs.version }}`.

            Updated inputs:
            - download URL: `${{ steps.release.outputs.url }}`
            - source: `${{ steps.src.outputs.hash }}`
