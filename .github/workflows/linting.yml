name: Linting

on:
  pull_request:
  push:
    branches:
      - main
      - dev
    paths:
      - "Linux/**"
      - ".github/dependabot.yml"
      - ".github/workflows/**"

jobs:
  linting:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: Linux/installer/go.mod
          cache-dependency-path: Linux/installer/go.sum

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install shell-check toolchain (fish, shellcheck, jq)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fish shellcheck jq

      - name: Lint GitHub Actions workflows
        run: nix run nixpkgs#actionlint -- .github/workflows/*.yml

      - name: Run linting + tests
        run: make -C Linux all

      - name: Evaluate preset NixOS hosts
        run: |
          for preset in minimal desktop developer personal; do
            nix eval --raw --no-write-lock-file \
              "path:${GITHUB_WORKSPACE}?dir=Linux/NixOS/presets/${preset}#checks.x86_64-linux.preset-host.drvPath"
          done
