name: Update Ghidra MCP

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Specific GhidraMCP version without leading v (optional)"
        required: false
        type: string
  schedule:
    - cron: "15 10 * * 1"

jobs:
  update-ghidra-mcp:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31.10.5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Read current version
        id: current
        run: |
          current="$(grep -oP 'ghidraMcpVersion = "\K[^"]+' Linux/NixOS/packages/ghidra-mcp.nix | head -1)"
          echo "version=$current" >> "$GITHUB_OUTPUT"

      - name: Resolve latest release
        id: release
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
            api_url="https://api.github.com/repos/LaurieWired/GhidraMCP/releases/tags/$version"
          else
            api_url="https://api.github.com/repos/LaurieWired/GhidraMCP/releases/latest"
          fi

          json="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              "$api_url"
          )"

          version="$(printf '%s' "$json" | jq -r '.tag_name | sub("^v"; "")')"
          asset_url="$(
            printf '%s' "$json" \
              | jq -r '.assets[] | select(.name | startswith("GhidraMCP-release-") and endswith(".zip")) | .browser_download_url' \
              | head -1
          )"

          if [ -z "$version" ] || [ "$version" = "null" ] || [ -z "$asset_url" ]; then
            echo "::error::Failed to resolve latest GhidraMCP release asset"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "asset_url=$asset_url" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        run: |
          current="${{ steps.current.outputs.version }}"
          target="${{ steps.release.outputs.version }}"
          manual="${{ github.event.inputs.version }}"

          if [ "$current" = "$target" ]; then
            echo "should_update=false" >> "$GITHUB_OUTPUT"
            echo "GhidraMCP is already on v$current"
            exit 0
          fi

          if [ -n "$manual" ]; then
            echo "should_update=true" >> "$GITHUB_OUTPUT"
            echo "Manual update requested: v$current -> v$target"
            exit 0
          fi

          newest="$(printf '%s\n%s\n' "$current" "$target" | sort -V | tail -1)"
          if [ "$newest" != "$target" ]; then
            echo "should_update=false" >> "$GITHUB_OUTPUT"
            echo "Latest GitHub release v$target is not newer than packaged v$current; skipping downgrade."
            exit 0
          fi

          echo "should_update=true" >> "$GITHUB_OUTPUT"
          echo "Updating GhidraMCP: v$current -> v$target"

      - name: Compute release hash
        id: src
        if: steps.compare.outputs.should_update == 'true'
        run: |
          hash="$(
            nix store prefetch-file --json "${{ steps.release.outputs.asset_url }}" \
              | jq -r '.hash'
          )"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Patch version and hash
        if: steps.compare.outputs.should_update == 'true'
        run: |
          sed -i 's/ghidraMcpVersion = "[^"]*"/ghidraMcpVersion = "${{ steps.release.outputs.version }}"/' Linux/NixOS/packages/ghidra-mcp.nix
          sed -i 's|hash = "sha256-[^"]*"|hash = "${{ steps.src.outputs.hash }}"|' Linux/NixOS/packages/ghidra-mcp.nix

      - name: Verify package build
        if: steps.compare.outputs.should_update == 'true'
        run: |
          nix build --no-write-lock-file --impure --expr '
            let
              pkgs = import <nixpkgs> { };
              module = import ./Linux/NixOS/packages/ghidra-mcp.nix {
                inherit pkgs;
                lib = pkgs.lib;
                config = { mysetup.features.ctfTools = true; };
              };
            in
            pkgs.linkFarm "ghidra-mcp-test" (map (p: { name = p.name; path = p; }) module.environment.systemPackages)
          '

      - name: Create pull request
        if: steps.compare.outputs.should_update == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(nix): update ghidra mcp"
          branch: "update-ghidra-mcp"
          delete-branch: true
          add-paths: |
            Linux/NixOS/packages/ghidra-mcp.nix
          title: "Update Ghidra MCP to v${{ steps.release.outputs.version }}"
          body: |
            Updates local `ghidra-mcp` packaging to `v${{ steps.release.outputs.version }}`.

            Updated hash:
            - source: `${{ steps.src.outputs.hash }}`
