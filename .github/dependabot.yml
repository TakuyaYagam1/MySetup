version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(github)"
  - package-ecosystem: gomod
    directory: "/Linux/installer"
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(go)"
