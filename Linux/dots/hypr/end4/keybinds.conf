# hyprlang noerror false
# MySetup overrides are sourced after upstream end4 binds on purpose.
# This file restores the MySetup shortcuts the end4 base profile does not keep.

#!
##! MySetup
unbind = Ctrl+Super+Alt, Slash
bind = Ctrl+Super+Alt, Slash, exec, xdg-open ~/.config/hypr/end4/mysetup/keybinds.conf # Edit MySetup keybind overrides
bind = Ctrl+Shift, W, exec, ~/.config/hypr/scripts/shell-selector.sh toggle # Runtime shell selector

##! Apps
unbind = Super, Return
bind = Super, Return, exec, app2unit -- foot # Terminal

unbind = Super, E
bind = Super, E, exec, app2unit -- thunar # File explorer
bind = Super+Alt, E, exec, app2unit -- nemo # Alternate file explorer

bind = Super+Shift, F, exec, app2unit -- zen # Zen Browser

unbind = Super+Shift, C
bind = Super+Shift, C, exec, app2unit -- cursor # Cursor
bind = Super+Shift, V, exec, app2unit -- code # VS Code
bind = Super+Shift, G, exec, app2unit -- goland # GoLand
bind = Super+Shift, D, exec, app2unit -- datagrip # DataGrip

unbind = Super+Shift, A
bind = Super+Shift, A, exec, app2unit -- antigravity # Antigravity
bind = Super+Shift, Q, exec, app2unit -- AmneziaVPN # AmneziaVPN

unbind = Super+Shift, N
bind = Super+Shift, N, exec, app2unit -- v2rayN # v2rayN

bind = Super+Shift, I, exec, ~/.config/hypr/end4/mysetup/scripts/spotify-toggle.sh # Spotify

unbind = Super+Shift, T
bind = Super+Shift, T, exec, app2unit -- Telegram # Telegram

unbind = Super+Shift, B
bind = Super+Shift, B, exec, app2unit -- vesktop # Vesktop

unbind = Ctrl+Shift, Escape
bind = Ctrl+Shift, Escape, exec, app2unit -- foot --app-id btop --title btop btop # btop
bind = Ctrl+Alt, Escape, exec, app2unit -- qps # Qps
bind = Ctrl+Alt, V, exec, app2unit -- pavucontrol # Pavucontrol

##! Utilities
unbind = Super, S
bind = Super, S, exec, ~/.config/hypr/end4/mysetup/scripts/screenshot.sh full # Full screen capture > file + clipboard

unbind = Super+Shift, S
bind = Super+Shift, S, exec, ~/.config/hypr/end4/mysetup/scripts/screenshot.sh region # Capture region > file + clipboard

bind = Super+Shift+Alt, S, exec, ~/.config/hypr/end4/mysetup/scripts/screenshot.sh edit # Capture region > editor
bind = Super, R, exec, ~/.config/hypr/end4/mysetup/scripts/record-toggle.sh # Toggle full screen recording with desktop audio

unbind = Super, C
bind = Super, C, exec, hyprpicker -a # Colour picker
