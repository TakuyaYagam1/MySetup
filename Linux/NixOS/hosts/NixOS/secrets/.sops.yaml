# sops-nix recipients config.
#
# This is the only .sops.yaml in the project; sops walks upward from any
# secrets.yaml to find it, so a single copy serves both system-level
# (hosts/NixOS/secrets/) and HM-level (home/secrets/).
#
# Replace the placeholder age keys below with real ones:
#
# Host key (for system-level: /run/secrets/*):
#   sudo ssh-keygen -f /etc/ssh/ssh_host_ed25519_key -y | ssh-to-age
#
# User key (for HM-level: $HOME/.ssh/*, $HOME/.netrc, etc.):
#   age-keygen -o ~/.config/sops/age/keys.txt
#   age-keygen -y ~/.config/sops/age/keys.txt
#
# Never commit private keys. Only public age keys go here.

keys:
  - &host_nixos  age1replace_with_host_public_age_key_xxxxxxxxxxxxxxxxxxxxxxxxxx
  - &user_main   age1replace_with_user_public_age_key_xxxxxxxxxxxxxxxxxxxxxxxxxx

creation_rules:
  # System-level: encrypted to host+user (root reads at activation,
  # the user can edit via `sops hosts/NixOS/secrets/secrets.yaml`).
  - path_regex: hosts/NixOS/secrets/.*\.yaml$
    key_groups:
      - age:
          - *host_nixos
          - *user_main

  # HM-level: user-key only. Host services do not read these secrets.
  - path_regex: home/secrets/.*\.yaml$
    key_groups:
      - age:
          - *user_main
